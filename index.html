<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gold Desk · XAUUSD SMC/ICT</title>
<style>
:root{--bg:#0f0e0a;--card:#1a1812;--bd:#332f20;--tx:#f1ead6;--mu:#a39a7c;--gold:#e5b53a;--up:#3ecf8e;--dn:#f0605d;--wr:#f0a43a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf6ea;--card:#fff;--bd:#e4dcc2;--tx:#2a2412;--mu:#7d7456;--gold:#a87a00;--up:#12875a;--dn:#c73a37;--wr:#b86f00}}
:root[data-theme="light"]{--bg:#faf6ea;--card:#fff;--bd:#e4dcc2;--tx:#2a2412;--mu:#7d7456;--gold:#a87a00;--up:#12875a;--dn:#c73a37;--wr:#b86f00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:4px 0 2px;color:var(--gold)}.sub{color:var(--mu);font-size:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 8px}
textarea{width:100%;height:90px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:12px ui-monospace,monospace}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 4px}
input[type=number]{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px;width:90px}
button{background:var(--gold);color:#1a1405;border:0;border-radius:10px;padding:12px;font-weight:700;width:100%;font-size:15px;margin-top:10px}
.verdict{font-size:20px;font-weight:800;margin:2px 0 6px}.buy{color:var(--up)}.sell{color:var(--dn)}.wait{color:var(--wr)}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row b{font-variant-numeric:tabular-nums}.tag{display:inline-block;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);font-size:12px;color:var(--mu)}
.news{display:flex;gap:8px;align-items:center;font-size:14px}.stop{background:var(--dn);color:#fff;border-radius:8px;padding:8px;margin-top:8px;font-weight:700}
.note{font-size:11px;color:var(--mu)}
</style></head><body><main>
<h1>🥇 Gold Desk · XAUUSD</h1>
<div class="sub">SMC/ICT sniper: sweep → BOS → FVG. Output: entry &amp; SL only.</div>

<div class="card"><h2>News gate</h2>
<label class="news"><input type="checkbox" id="news"> High-impact USD news (CPI / NFP / FOMC) within 30 min</label>
<div id="newsBox"></div></div>

<div class="card"><h2>Live feed</h2><div id="st" class="row"><span>Connecting…</span><b></b></div>
<label>SL buffer ($)</label><input type="number" id="buf" value="0.5" step="0.1" min="0">
<textarea id="htf" hidden></textarea><textarea id="ltf" hidden></textarea></div>
<div class="card" id="out" hidden></div>
<div class="note">Candles stream from your MT5 terminal every ~10s. If the feed goes stale the panel warns you. Not financial advice.</div>
</main>
<script>
const $=id=>document.getElementById(id);
function parse(t){const out=[];for(const l of t.split(/\r?\n/)){const tk=l.trim().split(/[,\t;\s]+/).filter(Boolean);const n=tk.filter(x=>/^-?\d+(\.\d+)?$/.test(x)).map(Number);if(n.length>=5&&n[0]>1e8)n.shift();if(n.length>=4){const[o,h,lo,c]=n;if(h>=Math.max(o,c)&&lo<=Math.min(o,c))out.push({o,h,l:lo,c})}}return out}
function swings(c,n=2){const H=[],L=[];for(let i=n;i<c.length-n;i++){let h=true,l=true;for(let k=1;k<=n;k++){if(!(c[i].h>c[i-k].h&&c[i].h>c[i+k].h))h=false;if(!(c[i].l<c[i-k].l&&c[i].l<c[i+k].l))l=false}if(h)H.push({i,p:c[i].h});if(l)L.push({i,p:c[i].l})}return{H,L}}
function bias(c){const s=swings(c);if(s.H.length<2||s.L.length<2)return 0;const a=s.H.at(-1).p>s.H.at(-2).p,b=s.L.at(-1).p>s.L.at(-2).p,x=s.H.at(-1).p<s.H.at(-2).p,y=s.L.at(-1).p<s.L.at(-2).p;return a&&b?1:x&&y?-1:0}
function longSetup(c,buf){const{L}=swings(c),N=c.length;let best=null;const avg=c.slice(-20).reduce((a,x)=>a+Math.abs(x.c-x.o),0)/Math.min(20,N);
for(const s of L){let j=-1;for(let q=s.i+1;q<N;q++)if(c[q].l<s.p){j=q;break}
if(j<0||c[j].c<=s.p)continue;let ref=-Infinity;for(let q=s.i;q<=j;q++)ref=Math.max(ref,c[q].h);
let k=-1;for(let q=j+1;q<N;q++)if(c[q].c>ref){k=q;break}if(k<0)continue;
let m=-1;for(let q=j;q<=k&&q+2<N;q++)if(c[q].h<c[q+2].l)m=q;if(m<0)continue;
let lo=Infinity;for(let q=j;q<=k;q++)lo=Math.min(lo,c[q].l);const sl=lo-buf;
if(c.slice(k+1).some(x=>x.c<sl))continue;
const top=c[m+2].l,bot=c[m].h,mid=(top+bot)/2;const tapped=c.slice(m+3).some(x=>x.l<=mid);const last=c[N-1];
const status=tapped?"tapped":(last.l<=top?"inzone":"wait");const disp=Math.abs(c[k].c-c[k].o)>1.5*avg;
if(!best||k>best.k)best={k,j,entry:mid,top,bot,sl,status,disp}}return best}
function inv(c){return c.map(x=>({o:-x.o,h:-x.l,l:-x.h,c:-x.c}))}
function shortSetup(c,buf){const r=longSetup(inv(c),buf);if(!r)return null;return{...r,entry:-r.entry,top:-r.bot,bot:-r.top,sl:-r.sl}}
const f=x=>x.toFixed(2);
function run(){const ltf=parse($("ltf").value),htf=parse($("htf").value),buf=+$("buf").value||0;const out=$("out");out.hidden=false;
try{localStorage.setItem("gd",JSON.stringify([$("htf").value,$("ltf").value,$("buf").value]))}catch(e){}
if(ltf.length<20){out.innerHTML='<div class="verdict wait">Need data</div>Paste at least 20 M15 candles.';return}
const b=htf.length>=10?bias(htf):bias(ltf),bt=b>0?"Bullish":b<0?"Bearish":"Range / unclear";
const L=longSetup(ltf,buf),S=shortSetup(ltf,buf);let s=null,dir=0;
if(L&&(!S||L.k>=S.k)){s=L;dir=1}else if(S){s=S;dir=-1}
const px=ltf.at(-1).c;let h=`<h2>Gold verdict</h2>`;
if($("news").checked)h+='<div class="stop">⛔ News gate ON — stand aside</div>';
if(!s){h+=`<div class="verdict wait">NO SETUP</div><div class="row"><span>Price</span><b>${f(px)}</b></div><div class="row"><span>HTF bias</span><b>${bt}</b></div><div class="note">No sweep → BOS → FVG sequence is valid right now. Wait.</div>`;out.innerHTML=h;return}
const aligned=dir===b,score=3+(s.disp?1:0)+(aligned?1:0);
const tier=score>=5?"Excellent · 1:5–1:8":score===4?"A+ · 1:4–1:5":"Valid · 1:2–1:3";
const st={wait:"Waiting for retrace into FVG",inzone:"Price is in the FVG — trigger zone",tapped:"Zone already tapped — skip"}[s.status];
const risk=Math.abs(s.entry-s.sl);
h+=`<div class="verdict ${s.status==="tapped"?"wait":dir>0?"buy":"sell"}">${dir>0?"BUY":"SELL"} · ${s.status==="inzone"?"READY":s.status==="wait"?"PENDING":"EXPIRED"}</div><div class="note" style="margin-bottom:6px">${st}</div>
<div class="row"><span>Entry (FVG mid)</span><b>${f(s.entry)}</b></div>
<div class="row"><span>Stop loss</span><b>${f(s.sl)}</b></div>
<div class="row"><span>Risk</span><b>${f(risk)} pts</b></div>
<div class="row"><span>Current price</span><b>${f(px)}</b></div>
<div class="row"><span>Setup tier</span><b>${tier}</b></div>
<div class="row"><span>HTF bias</span><b>${bt} ${aligned?"✓ aligned":"⚠ counter-bias"}</b></div>
<div class="row"><span>Confluence</span><span><span class="tag">Sweep</span> <span class="tag">BOS</span> <span class="tag">FVG</span>${s.disp?' <span class="tag">Displacement</span>':''}</span></div>
<div class="row"><span>Targets</span><b>${[2,3,5,8].map(r=>f(s.entry+dir*risk*r)).join(" · ")}</b></div>
<div class="note">Targets = RR 1:2 · 1:3 · 1:5 · 1:8. Move SL to breakeven once in profit.</div>`;
out.innerHTML=h}
const rows=a=>a.map(x=>[x.o,x.h,x.l,x.c].join(",")).join("\n");
async function poll(){const st=$("st");try{const r=await fetch("/api/state",{cache:"no-store"});const d=await r.json();
if(!d.ltf){st.innerHTML="<span>Waiting for MT5 feed…</span><b>—</b>";return}
const age=Math.round((Date.now()-d.ts)/1000);$("htf").value=rows(d.htf);$("ltf").value=rows(d.ltf);run();
const stale=age>120;st.innerHTML=`<span>${stale?"⚠ FEED STALE":"● LIVE"}</span><b>${age}s ago</b>`;
if(stale)$("out").insertAdjacentHTML("afterbegin",'<div class="stop">Feed stale — MT5 not sending. Do not trade this signal.</div>')}
catch(e){st.innerHTML="<span>Server unreachable</span><b>—</b>"}}
$("buf").onchange=poll;setInterval(poll,10000);poll();
</script></body></html>
